name: LLM Summary

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kohsmemo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: kohsmemo

    - name: Checkout kohsmemo-summary
      uses: actions/checkout@v4
      with:
        repository: leehyon/kohsmemo-summary
        ref: main
        path: kohsmemo-summary
        token: ${{ secrets.SUMMARY_SYNC_PAT }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r kohsmemo-summary/requirements.txt

    - name: Process changes
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_MODEL: ${{ vars.LLM_MODEL }}
        LLM_API_ENDPOINT: ${{ vars.LLM_API_ENDPOINT }}
      run: |
        python kohsmemo-summary/process_changes.py

    - name: Commit changes to kohsmemo-summary
      run: |
        cd kohsmemo-summary
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "ci: add new summaries" || echo "No changes to commit"
        git push
